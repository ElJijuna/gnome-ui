<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GNOME UI</title>
    <!--
      GitHub Pages has no server-side router, so any deep link (e.g.
      /components/react/button) 404s here. Stash the intended path in
      sessionStorage and redirect to the real app shell, which restores it.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      sessionStorage.redirect = location.href;
    </script>
    <meta http-equiv="refresh" content="0;URL='/'" />
  </head>
  <body></body>
</html>
