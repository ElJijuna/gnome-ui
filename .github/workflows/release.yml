name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── 1. Build all packages ──────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            packages/core/src/tokens.css
            packages/core/src/tokens.d.ts
            packages/icons/dist/
            packages/react/dist/
            packages/charts/dist/
            packages/platform/dist/
            packages/hooks/dist/
            packages/layout/dist/
            packages/cli/dist/
            packages/web-components/dist/
            packages/react-native/dist/
            packages/react-native-charts/dist/

  # ── 2a. Release @gnome-ui/core ─────────────────────────────────────────────
  release-core:
    name: Release @gnome-ui/core
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Release
        working-directory: packages/core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      # semantic-release tags the release commit (HEAD); no tag means nothing was published.
      - name: Detect published release
        id: release-check
        run: |
          tag="$(git tag --points-at HEAD --list '@gnome-ui/core@*' | head -n 1)"
          echo "version=${tag##*@}" >> "$GITHUB_OUTPUT"

  # ── 2b. Release @gnome-ui/web-components ─────────────────────────────────
  release-web-components:
    name: Release @gnome-ui/web-components
    needs: release-core
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Build @gnome-ui/icons
        run: npm run build --workspace=packages/icons

      - name: Build @gnome-ui/web-components
        run: npm run build --workspace=packages/web-components

      - name: Release
        working-directory: packages/web-components
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      # semantic-release tags the release commit (HEAD); no tag means nothing was published.
      - name: Detect published release
        id: release-check
        run: |
          tag="$(git tag --points-at HEAD --list '@gnome-ui/web-components@*' | head -n 1)"
          echo "version=${tag##*@}" >> "$GITHUB_OUTPUT"

  # ── 2c. Release @gnome-ui/icons ────────────────────────────────────────────
  release-icons:
    name: Release @gnome-ui/icons
    needs: release-web-components
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Build @gnome-ui/icons
        run: npm run build --workspace=packages/icons

      - name: Release
        working-directory: packages/icons
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      # semantic-release tags the release commit (HEAD); no tag means nothing was published.
      - name: Detect published release
        id: release-check
        run: |
          tag="$(git tag --points-at HEAD --list '@gnome-ui/icons@*' | head -n 1)"
          echo "version=${tag##*@}" >> "$GITHUB_OUTPUT"

  # ── 2c. Release @gnome-ui/charts ──────────────────────────────────────────
  release-charts:
    name: Release @gnome-ui/charts
    needs: release-icons
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Build @gnome-ui/icons
        run: npm run build --workspace=packages/icons

      - name: Build @gnome-ui/platform
        run: npm run build --workspace=packages/platform

      - name: Build @gnome-ui/hooks
        run: npm run build --workspace=packages/hooks

      - name: Build @gnome-ui/react
        run: npm run build --workspace=packages/react

      - name: Build @gnome-ui/charts
        run: npm run build --workspace=packages/charts

      - name: Release
        working-directory: packages/charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      # semantic-release tags the release commit (HEAD); no tag means nothing was published.
      - name: Detect published release
        id: release-check
        run: |
          tag="$(git tag --points-at HEAD --list '@gnome-ui/charts@*' | head -n 1)"
          echo "version=${tag##*@}" >> "$GITHUB_OUTPUT"

  # ── 2d. Release @gnome-ui/platform ───────────────────────────────────────
  release-platform:
    name: Release @gnome-ui/platform
    needs: release-charts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Build @gnome-ui/platform
        run: npm run build --workspace=packages/platform

      - name: Release
        working-directory: packages/platform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      # semantic-release tags the release commit (HEAD); no tag means nothing was published.
      - name: Detect published release
        id: release-check
        run: |
          tag="$(git tag --points-at HEAD --list '@gnome-ui/platform@*' | head -n 1)"
          echo "version=${tag##*@}" >> "$GITHUB_OUTPUT"

  # ── 2e. Release @gnome-ui/hooks ───────────────────────────────────────────
  release-hooks:
    name: Release @gnome-ui/hooks
    needs: release-platform
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Build @gnome-ui/platform
        run: npm run build --workspace=packages/platform

      - name: Build @gnome-ui/hooks
        run: npm run build --workspace=packages/hooks

      - name: Release
        working-directory: packages/hooks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      # semantic-release tags the release commit (HEAD); no tag means nothing was published.
      - name: Detect published release
        id: release-check
        run: |
          tag="$(git tag --points-at HEAD --list '@gnome-ui/hooks@*' | head -n 1)"
          echo "version=${tag##*@}" >> "$GITHUB_OUTPUT"

  # ── 2f. Release @gnome-ui/layout ─────────────────────────────────────────
  release-layout:
    name: Release @gnome-ui/layout
    needs: [release-charts, release-hooks]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Build @gnome-ui/icons
        run: npm run build --workspace=packages/icons

      - name: Build @gnome-ui/platform
        run: npm run build --workspace=packages/platform

      - name: Build @gnome-ui/hooks
        run: npm run build --workspace=packages/hooks

      - name: Build @gnome-ui/react
        run: npm run build --workspace=packages/react

      - name: Build @gnome-ui/layout
        run: npm run build --workspace=packages/layout

      - name: Release
        working-directory: packages/layout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      # semantic-release tags the release commit (HEAD); no tag means nothing was published.
      - name: Detect published release
        id: release-check
        run: |
          tag="$(git tag --points-at HEAD --list '@gnome-ui/layout@*' | head -n 1)"
          echo "version=${tag##*@}" >> "$GITHUB_OUTPUT"

  # ── 3. Release @gnome-ui/react (after icons + charts + hooks + layout) ───
  release-react:
    name: Release @gnome-ui/react
    needs: [release-icons, release-hooks, release-layout]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Build @gnome-ui/icons
        run: npm run build --workspace=packages/icons

      - name: Build @gnome-ui/platform
        run: npm run build --workspace=packages/platform

      - name: Build @gnome-ui/hooks
        run: npm run build --workspace=packages/hooks

      - name: Build @gnome-ui/react
        run: npm run build --workspace=packages/react

      - name: Release
        working-directory: packages/react
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      # semantic-release tags the release commit (HEAD); no tag means nothing was published.
      - name: Detect published release
        id: release-check
        run: |
          tag="$(git tag --points-at HEAD --list '@gnome-ui/react@*' | head -n 1)"
          echo "version=${tag##*@}" >> "$GITHUB_OUTPUT"

  # ── 4. Release @gnome-ui/cli ─────────────────────────────────────────────
  release-cli:
    name: Release @gnome-ui/cli
    needs: release-react
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Build @gnome-ui/cli
        run: npm run build --workspace=packages/cli

      - name: Release
        working-directory: packages/cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      # semantic-release tags the release commit (HEAD); no tag means nothing was published.
      - name: Detect published release
        id: release-check
        run: |
          tag="$(git tag --points-at HEAD --list '@gnome-ui/cli@*' | head -n 1)"
          echo "version=${tag##*@}" >> "$GITHUB_OUTPUT"

  # ── 5. Release @gnome-ui/react-native ────────────────────────────────────
  release-react-native:
    name: Release @gnome-ui/react-native
    needs: release-cli
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Build @gnome-ui/icons
        run: npm run build --workspace=packages/icons

      - name: Build @gnome-ui/react-native
        run: npm run build --workspace=packages/react-native

      - name: Release
        working-directory: packages/react-native
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      # semantic-release tags the release commit (HEAD); no tag means nothing was published.
      - name: Detect published release
        id: release-check
        run: |
          tag="$(git tag --points-at HEAD --list '@gnome-ui/react-native@*' | head -n 1)"
          echo "version=${tag##*@}" >> "$GITHUB_OUTPUT"

  # ── 6. Release @gnome-ui/react-native-charts ─────────────────────────────
  release-react-native-charts:
    name: Release @gnome-ui/react-native-charts
    needs: release-react-native
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Build @gnome-ui/icons
        run: npm run build --workspace=packages/icons

      - name: Build @gnome-ui/react-native
        run: npm run build --workspace=packages/react-native

      - name: Build @gnome-ui/react-native-charts
        run: npm run build --workspace=packages/react-native-charts

      - name: Release
        working-directory: packages/react-native-charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      # semantic-release tags the release commit (HEAD); no tag means nothing was published.
      - name: Detect published release
        id: release-check
        run: |
          tag="$(git tag --points-at HEAD --list '@gnome-ui/react-native-charts@*' | head -n 1)"
          echo "version=${tag##*@}" >> "$GITHUB_OUTPUT"

  # ── 7. Mirror released packages to GitHub Packages ───────────────────────
  # Separate jobs so a failure here never affects npm, which has already
  # published by the time these run.
  github-packages-plan:
    name: Plan GitHub Packages mirror
    needs:
      - release-core
      - release-web-components
      - release-icons
      - release-charts
      - release-platform
      - release-hooks
      - release-layout
      - release-react
      - release-cli
      - release-react-native
      - release-react-native-charts
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.plan.outputs.include }}
    steps:
      - name: List released packages
        id: plan
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          include="$(jq -c '[to_entries[]
            | select(.value.outputs.version // "" | length > 0)
            | {package: (.key | sub("^release-"; "")), version: .value.outputs.version}]' <<< "$NEEDS")"
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "Packages to mirror: $include"

  github-packages:
    name: Publish @eljijuna/gnome-ui-${{ matrix.package }} to GitHub Packages
    needs: github-packages-plan
    if: ${{ !cancelled() && needs.github-packages-plan.outputs.include != '[]' && needs.github-packages-plan.outputs.include != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.github-packages-plan.outputs.include) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The release tag carries the package.json bumped to the released version.
          ref: refs/tags/@gnome-ui/${{ matrix.package }}@${{ matrix.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@eljijuna'

      - run: npm ci

      - name: Build @gnome-ui/${{ matrix.package }} and its workspace dependencies
        run: npx turbo build --filter=@gnome-ui/${{ matrix.package }}...

      # Only in this job: GitHub Packages requires the owner's scope. Internal
      # @gnome-ui/* dependencies keep resolving from npmjs.
      - name: Scope the package for GitHub Packages
        working-directory: packages/${{ matrix.package }}
        run: |
          npm pkg set name=@eljijuna/gnome-ui-${{ matrix.package }}
          npm pkg set repository.type=git
          npm pkg set repository.url=git+https://github.com/${{ github.repository }}.git
          npm pkg set repository.directory=packages/${{ matrix.package }}

      - name: Publish
        working-directory: packages/${{ matrix.package }}
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
